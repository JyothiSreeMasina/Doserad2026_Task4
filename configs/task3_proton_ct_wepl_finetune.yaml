# Fine-tune of Task 3 (proton/CT), layering the water-equivalent-path-length
# (WEPL) range correction (see beam_encoder.py's
# ProtonBeamEncoder._water_equivalent_peak_depth docstring) on top of the
# already-trained checkpoint (checkpoints/task3_proton_ct/best.pt, epoch 6).
# Separate checkpoint_dir so the original checkpoint stays intact.
#
# Motivation: the first real Grand Challenge submission (2026-08-25, rank
# 50) showed a disproportionately bad IDD Curve Distance (~320x worse than
# the #1 entry, vs ~9x worse on overall Beam MAE) -- IDD Curve Distance
# specifically measures Bragg-peak/depth-dose-profile position, and the
# previous encoder computed proton range assuming the entire beam path is
# water, ignoring real tissue density from the CT. This fine-tune re-points
# the network at the corrected (CT-density-aware) input prior; epochs
# bounded low (short fine-tune, not a retrain) given the Aug 31 deadline.

data:
  data_root: /home/jmasina/DoseRAD/data/proton_ct
  task: proton
  modality: ct
  split: training
  target_shape: [176, 512, 512]
  target_spacing: [3.0, 1.0, 1.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 1000.0

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0001
  weight_decay: 0.00001
  epochs: 9
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task3_proton_ct_wepl_finetune
log_every: 20
save_every_steps: 2000
