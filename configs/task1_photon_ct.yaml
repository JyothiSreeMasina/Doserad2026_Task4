# DoseRAD2026 Task 1 (photon/CT) training config.

data:
  data_root: /home/jmasina/DoseRAD/data/photon_ct  # absolute: lives outside this project dir, see PROGRESS_LOG.md
  task: photon
  split: training
  target_shape: [256, 256, 256]
  target_spacing: [2.0, 2.0, 2.0]
  val_fraction: 0.1   # held-out patients, not held-out control points -- avoids leakage
  seed: 42
  num_workers: 16  # measured: 16-32 workers plateau at ~2.8hr/epoch on this server (96 cores) -- compute-bound, not I/O-bound
  cache_size: 4        # CT volumes kept in memory (lru_cache), shared across a patient's 540 control points
  dose_scale: 10000.0  # real per-CP dose max measured at ~5e-5 to 1.3e-4 Gy (120-sample check, 2026-08-06);
                        # scaling puts targets near O(1) to match the model's unconstrained output range.
                        # Metrics are all relative/normalized so this is invisible to them, but any inference
                        # or submission code MUST divide raw model output by this factor to get real Gy back.

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1  # matches the official Masked MAE metric definition
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2  # 2026-08-10: penalize dose predicted outside the body mask (verified near-zero GT there)
                  # -- root cause of the epoch-4 model's bad idd_curve_distance/gamma_index_pass_rate,
                  # see PROGRESS_LOG.md and src/training/losses.py module docstring

optim:
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 10  # 2026-08-06 relaunch after the first run silently NaN'd out at epoch 0 step ~29980 (see
              # PROGRESS_LOG.md) -- deliberately shorter than the original 15-epoch attempt so we can
              # confirm real stability + a real val trend before committing more of the 9 remaining days;
              # extend via `--resume`.
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task1_photon_ct
log_every: 20
save_every_steps: 2000  # mid-epoch safety checkpoint -- the broken run went undetected for ~69hr because
                         # checkpoints only saved once per (multi-hour) epoch; see PROGRESS_LOG.md
