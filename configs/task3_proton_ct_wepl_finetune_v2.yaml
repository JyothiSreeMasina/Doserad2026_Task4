# Retry of the WEPL fine-tune (see task3_proton_ct_wepl_finetune.yaml for the
# original motivation) after fixing a bug in
# ProtonBeamEncoder._water_equivalent_peak_depth: when a beam's tissue path
# didn't accumulate enough water-equivalent depth to reach the target range
# within the sampling window (beam exits near/through the patient's surface),
# the old fallback clamped to the last sampled index -- a fixed ~349mm jump
# unrelated to the beam's actual physics, up to 121mm off truth on one real
# beamlet. Fixed to fall back to the water-only estimate in that case
# instead. Diagnostic spot-check post-fix: mean WEPL error 6.5mm, beating
# the water-only baseline's 7.6mm (previously WEPL was worse: 8.2mm).
#
# First attempt (task3_proton_ct_wepl_finetune.yaml, 2 epochs) regressed val
# loss (0.0974 -> 0.1035, both worse than the 0.0802 baseline) because of the
# bug above. This run resumes from the same epoch-6 checkpoint with the
# fixed encoder, for 3 epochs instead of 2, in a fresh checkpoint_dir so the
# corrupted first attempt's checkpoints aren't reused.

data:
  data_root: /home/jmasina/DoseRAD/data/proton_ct
  task: proton
  modality: ct
  split: training
  target_shape: [176, 512, 512]
  target_spacing: [3.0, 1.0, 1.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 1000.0

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0001
  weight_decay: 0.00001
  epochs: 10
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task3_proton_ct_wepl_finetune_v2
log_every: 20
save_every_steps: 2000
