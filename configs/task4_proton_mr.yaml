# DoseRAD2026 Task 4 (proton/MR) training config.
#
# Reuses Task 3's proton geometry/physics (ProtonBeamEncoder, target
# shape/spacing, dose_scale -- the dose targets are identical Geant4
# grids regardless of which image modality is fed in) with Task 2's MR
# preprocessing (BodyMaskMR/NormalizeMR instead of BodyMask/NormalizeCT),
# selected automatically by scripts/train.py based on `modality` below --
# no code changes needed for this combination, it was already generic.
#
# data_root points at the same proton_ct download as Task 3: each
# patient folder there already has both ct.mha and mr.mha (confirmed
# across all 75 training patients, 2026-08-20), so no separate download
# was needed for this task.

data:
  data_root: /home/jmasina/DoseRAD/data/proton_ct
  task: proton
  modality: mr
  split: training
  target_shape: [176, 512, 512]
  target_spacing: [3.0, 1.0, 1.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 1000.0  # same proton dose grids as Task 3 -- see task3_proton_ct.yaml's comment

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 10
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task4_proton_mr
log_every: 20
save_every_steps: 2000
