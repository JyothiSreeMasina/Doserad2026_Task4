# Fine-tune of Task 2 (photon/MR), layering the depth-attenuation prior
# on top of the already penumbra-softened checkpoint
# (checkpoints/task2_photon_mr_penumbra_finetune/best.pt, epoch 2).
# epochs bounded to 4 (2 more epochs from the resumed epoch 2) -- kept
# short given Task 2's known fast-overfitting behavior (both the
# original run and the penumbra finetune had their best val loss in the
# first couple epochs after any resume/start, then degraded steadily).

data:
  data_root: /home/jmasina/DoseRAD/data/photon_ct
  task: photon
  modality: mr
  split: training
  target_shape: [256, 256, 256]
  target_spacing: [2.0, 2.0, 2.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 10000.0

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 4
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task2_photon_mr_depth_finetune
log_every: 20
save_every_steps: 2000
