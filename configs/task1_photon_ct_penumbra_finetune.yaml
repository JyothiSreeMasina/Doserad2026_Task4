# Fine-tune of Task 1 (photon/CT) from the existing best.pt (epoch 5)
# checkpoint, after softening PhotonBeamEncoder's aperture edge from a hard
# binary cutoff to a sigmoid falloff (see beam_encoder.py's PENUMBRA_SIGMA_MM
# docstring) -- attempting to close the large Local Gamma Index gap seen on
# the real Preliminary Testing Phase leaderboard (dose-gradient/edge shape
# is exactly what a hard binary mask can't represent).
#
# Separate checkpoint_dir from the original task1_photon_ct.yaml so the
# already-working checkpoint/submission is never at risk -- this is purely
# additive, evaluated locally before being considered for any real
# resubmission. epochs bounded to 8 (3 more epochs from the resumed
# checkpoint) to keep this an overnight-sized experiment, not an
# open-ended run.

data:
  data_root: /home/jmasina/DoseRAD/data/photon_ct
  task: photon
  modality: ct
  split: training
  target_shape: [256, 256, 256]
  target_spacing: [2.0, 2.0, 2.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 10000.0

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 8
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task1_photon_ct_penumbra_finetune
log_every: 20
save_every_steps: 2000
