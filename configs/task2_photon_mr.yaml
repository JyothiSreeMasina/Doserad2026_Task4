# DoseRAD2026 Task 2 (photon/MR) training config.
# Same patients, beam JSON, and dose targets as Task 1 (photon/CT) -- see
# PROGRESS_LOG.md 2026-08-15 entry -- data_root deliberately points at the
# already-downloaded photon_ct tree, since every patient folder there already
# has both image/ct.mha and image/mr.mha. Only `data.modality: mr` differs
# structurally from configs/task1_photon_ct.yaml (that flag routes
# scripts/train.py to BodyMaskMR/NormalizeMR instead of BodyMask/NormalizeCT
# -- MR has no HU-style physical calibration, see transforms.py docstrings).

data:
  data_root: /home/jmasina/DoseRAD/data/photon_ct  # same tree as Task 1 -- mr.mha lives alongside ct.mha per patient
  task: photon
  modality: mr
  split: training
  target_shape: [256, 256, 256]
  target_spacing: [2.0, 2.0, 2.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 10000.0  # same dose targets as Task 1 -- see configs/task1_photon_ct.yaml

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 10
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task2_photon_mr
log_every: 20
save_every_steps: 2000
