# Fine-tune of Task 2 (photon/MR) from the existing best.pt (epoch 1)
# checkpoint, same penumbra-softening change and rationale as
# configs/task1_photon_ct_penumbra_finetune.yaml -- both tasks share
# PhotonBeamEncoder, and both scored far behind the field specifically on
# Local Gamma Index on their real Preliminary Testing Phase submissions.
#
# Separate checkpoint_dir so the already-working checkpoint/submission is
# never at risk. epochs bounded to 5 (3 more epochs from the resumed
# checkpoint) -- kept short partly for the same overnight-sized-experiment
# reason as Task 1, and partly because Task 2's best.pt was already an
# early epoch (1), suggesting this task overfits fast; a short fine-tune
# window is a deliberate hedge against repeating that, not an oversight.

data:
  data_root: /home/jmasina/DoseRAD/data/photon_ct
  task: photon
  modality: mr
  split: training
  target_shape: [256, 256, 256]
  target_spacing: [2.0, 2.0, 2.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 10000.0

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 5
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task2_photon_mr_penumbra_finetune
log_every: 20
save_every_steps: 2000
