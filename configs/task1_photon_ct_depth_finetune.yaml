# Fine-tune of Task 1 (photon/CT), layering the depth-attenuation prior
# (see beam_encoder.py's MU_EFF_PER_MM docstring) on top of the already
# penumbra-softened checkpoint (checkpoints/task1_photon_ct_penumbra_finetune/best.pt,
# epoch 6). Separate checkpoint_dir so neither the original nor the
# penumbra-only checkpoint is at risk. epochs bounded to 10 (a few more
# epochs from the resumed epoch 6) -- this is a bigger informational
# change than the penumbra edit (real depth signal, not just edge
# smoothing), so it may need a bit more time to learn to exploit it, but
# still kept bounded given the penumbra experiment's marginal payoff.

data:
  data_root: /home/jmasina/DoseRAD/data/photon_ct
  task: photon
  modality: ct
  split: training
  target_shape: [256, 256, 256]
  target_spacing: [2.0, 2.0, 2.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 10000.0

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 10
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task1_photon_ct_depth_finetune
log_every: 20
save_every_steps: 2000
