# DoseRAD2026 Task 3 (proton/CT) training config.
# Unlike Task 2 (photon/MR), this is a genuinely new task: proton beams are
# pencil-beam-scanning (beam -> ray -> beamlet/energy-layer), not VMAT
# control points, so ProtonBeamEncoder (src/data/beam_encoder.py) implements
# real range-energy + Highland-scattering physics rather than reusing
# PhotonBeamEncoder's MLC-aperture geometry. See beam_encoder.py's
# ProtonBeamEncoder docstring for the full physics writeup and its real-data
# validation (peak within 3-17mm of true dose peak across 5 sanity-checked
# beamlets, PROGRESS_LOG.md 2026-08-16).
#
# Native resolution differs from photon too: this data ships at 1x1x3mm
# (target_spacing below, in dz,dy,dx order matching the dataset's spacing_zyx
# convention) per the reference doc's own resampling spec, vs photon's
# 2x2x2mm -- so this is NOT a drop-in reuse of task1's spacing. In-plane
# extent is also much larger (~445-498 voxels across the 5 patients checked
# so far) than photon's 256^3 grid; target_shape below (176,512,512) covers
# every patient checked with margin, at native resolution (no downsampling
# -- proton dosimetry cares about Bragg-peak sharpness, so trading spatial
# accuracy for a smaller grid was deliberately avoided). This roughly
# doubles per-sample voxel count vs Task 1, so expect slower epochs;
# launched on a free 40GB GPU (idx 2) to give headroom for that.

data:
  data_root: /home/jmasina/DoseRAD/data/proton_ct
  task: proton
  modality: ct
  split: training
  target_shape: [176, 512, 512]
  target_spacing: [3.0, 1.0, 1.0]
  val_fraction: 0.1
  seed: 42
  num_workers: 16
  cache_size: 4
  dose_scale: 1000.0  # proton per-beamlet max dose ~7e-4 to 1.7e-3 Gy (sampled 40 real beamlets, 1ABB006) --
                       # ~10x larger than photon's per-CP ~5e-5 to 1e-4, so a 10x smaller scale than
                       # task1's 10000.0 lands in the same near-O(1) target range.

model:
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  high_dose_frac: 0.1
  w_masked: 1.0
  w_body: 0.2
  w_outside: 0.2

optim:
  lr: 0.0002
  weight_decay: 0.00001
  epochs: 10
  grad_clip: 1.0
  accum_steps: 1
  amp: true

checkpoint_dir: checkpoints/task3_proton_ct
log_every: 20
save_every_steps: 2000
